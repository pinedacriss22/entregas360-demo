<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Entregas360 | Rastreo de entregas</title><link rel="stylesheet" href="../styles.css"><script src="../demo-api.js"></script><style>.tracking{display:flex;list-style:none;padding:0;margin:28px 0;gap:8px}.tracking li{flex:1;text-align:center;color:#64748b;font-size:13px;position:relative;border-top:4px solid #d1d5db;padding-top:20px}.tracking li:before{content:'○';position:absolute;top:-13px;left:calc(50% - 10px);width:20px;height:20px;border-radius:50%;background:#d1d5db;color:#334155;line-height:20px}.tracking li.active{border-color:#198754;color:#087c4e;font-weight:600}.tracking li.active:before{content:'✓';background:#198754;color:white}@media(max-width:520px){.tracking{flex-direction:column}.tracking li{text-align:left;border-top:0;border-left:4px solid #d1d5db;padding:10px 24px}.tracking li.active{border-color:#198754}.tracking li:before{left:-12px;top:10px}}</style></head><body><header><div class="logo">Entregas<span>360</span></div><nav><a href="../index.html">Inicio</a><a href="market.html">Market</a><a href="express.html">Express</a><a href="business.html">Business</a><a href="pedidos.html">Pedidos</a><a href="pagos.html">Pagos</a><a href="rastreo.html">Rastreo</a><a href="login.html">Iniciar sesión</a></nav></header><main><section class="servicios"><h1>Rastreo de entregas</h1><p>Versión demostrativa. No se realizan cobros ni envíos reales.</p><div class="tarjeta" style="margin:24px 0"><h2>Consulta tu entrega</h2><form id="buscar" style="display:flex;gap:12px;flex-wrap:wrap;margin-top:16px"><input id="codigo" aria-label="Código de seguimiento" placeholder="E360-XXXXXXXX" required style="flex:1;min-width:180px;padding:12px;border:1px solid #b9ccc2;border-radius:8px"><button class="btn" type="submit">Buscar pedido</button></form><p id="mensaje" role="status" style="margin-top:12px"></p></div><div id="resultado"></div><h2 style="margin:24px 0 12px">Mis solicitudes</h2><div id="historial"></div></section></main><footer>Entregas360 | San Pedro Sula</footer><script src="../sesion.js"></script><script src="../alertas.js"></script><script>
(()=>{
const read=(k,d)=>{try{return JSON.parse(localStorage.getItem('e360demo-v1-'+k))??d}catch{return d}};
const uid=read('session',null);if(!uid){location.replace('login.html');return;}
const orders=read('orders-'+uid,[]), result=document.getElementById('resultado'), history=document.getElementById('historial'), input=document.getElementById('codigo'), msg=document.getElementById('mensaje');
const node=(tag,text)=>{const n=document.createElement(tag);n.textContent=text;return n};
function show(o){result.replaceChildren();const card=node('article','');card.className='tarjeta';card.append(node('h2',o.id+' · '+o.type),node('p',o.detail),node('p',o.type==='Business'?'Importe por cotizar':'Total: L '+Number(o.total).toFixed(2)));const stages=o.type==='Business'?['Solicitud registrada','Cotización pendiente','Cotización aprobada']:['Pedido registrado','Pago confirmado','En camino','Entregado'];const current=o.type==='Business'?1:o.paid?2:0;const status=node('h3',o.type==='Business'?'Cotización pendiente':o.paid?'En camino':'Pendiente de pago');status.style.color='#087c4e';card.append(status);const track=node('ol','');track.className='tracking';stages.forEach((s,i)=>{const li=node('li',s);li.className=i<=current?'active':'';if(i===current)li.setAttribute('aria-current','step');track.append(li)});card.append(track,node('p','Seguimiento simulado para fines académicos.'));result.append(card);}
function search(){const code=input.value.trim().toUpperCase();const o=orders.find(x=>x.id.toUpperCase()===code);result.replaceChildren();msg.textContent=o?'':'No se encontró un pedido con ese código en tu cuenta.';if(o)show(o);}
document.getElementById('buscar').addEventListener('submit',e=>{e.preventDefault();search()});
if(!orders.length)history.append(node('p','No tienes solicitudes registradas.'));
orders.forEach(o=>{const card=node('article','');card.className='tarjeta';card.style.marginBottom='12px';card.append(node('h3',o.id+' · '+o.type),node('p',o.type==='Business'?'Cotización pendiente':o.paid?'En camino':'Pendiente de pago'));const b=node('button','Ver seguimiento');b.type='button';b.className='btn';b.onclick=()=>{input.value=o.id;search();result.scrollIntoView({behavior:'smooth',block:'center'})};card.append(b);history.append(card)});
const code=new URLSearchParams(location.search).get('codigo');if(code){input.value=code;search()}
})();
</script></body></html>
