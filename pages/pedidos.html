<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Entregas360 | Carrito y pedidos</title><link rel="stylesheet" href="../styles.css"><script src="../demo-api.js"></script><style>.order-card{margin:14px 0;padding:24px;text-align:left}.order-head,.order-actions,.cart-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.order-actions{justify-content:flex-start;margin-top:16px}.order-status{padding:6px 12px;border-radius:20px;font-size:13px;font-weight:600;background:#fff0d9;color:#875000}.order-status.paid{background:#e1f4e9;color:#087c4e}.order-total{font-size:22px;font-weight:700;color:#124c36}.cart-row{padding:12px 0;border-bottom:1px solid #e1e8e3}.cart-controls{display:flex;align-items:center;gap:10px}.cart-controls button{padding:6px 12px}.order-actions a{display:inline-block;text-decoration:none}.order-card p{margin:8px 0}.cart-summary{margin-top:16px}.order-card h3{margin:0}</style><style>.e360-photo{width:100%;height:155px;object-fit:cover;border-radius:12px;margin-bottom:12px}.e360-placeholder{height:155px;background:#e6f1e9;color:#176344;display:grid;place-items:center;border-radius:12px;margin-bottom:12px;font-size:38px}.e360-summary{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.e360-summary>div{flex:1;min-width:130px;background:white;border:1px solid #dce7df;padding:18px;border-radius:14px}.e360-summary strong{display:block;font-size:24px;color:#087c4e}.e360-tools{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}.e360-tools input,.e360-tools select{padding:12px;border:1px solid #bdcec3;border-radius:8px;max-width:100%}.e360-status{font-weight:600;color:#087c4e}.e360-card{margin:14px 0;text-align:left}.e360-card .btn{margin:8px 8px 0 0;display:inline-block}header nav{flex-wrap:wrap;gap:12px} @media(max-width:800px){header{flex-wrap:wrap;gap:12px}header nav{justify-content:flex-start}} </style></head><body><header><div class="logo">Entregas<span>360</span></div><nav><a href="../index.html">Inicio</a><a href="market.html">Market</a><a href="express.html">Express</a><a href="business.html">Business</a><a href="pedidos.html">Pedidos</a><a href="pagos.html">Pagos</a><a href="rastreo.html">Rastreo</a><a href="login.html">Iniciar sesión</a><a href="registro.html">Registrarse</a></nav></header><main><section class="servicios"><h1>Carrito y pedidos</h1><p>Versión demostrativa. No se realizan cobros ni envíos reales.</p><h2 style="margin-top:24px">Carrito</h2><div id="cart-view"></div><h2 style="margin-top:28px">Historial de solicitudes</h2><div id="order-view"></div></section></main><footer>Entregas360 | San Pedro Sula</footer><script src="../sesion.js"></script><script src="../alertas.js"></script><script>(()=>{
const read=(k,d)=>{try{return JSON.parse(localStorage.getItem('e360demo-v1-'+k))??d}catch{return d}};
const save=(k,v)=>localStorage.setItem('e360demo-v1-'+k,JSON.stringify(v));
const uid=read('session',null);if(!uid){location.replace('login.html');return;}
const ck='cart-'+uid,ok='orders-'+uid,cv=document.getElementById('cart-view'),ov=document.getElementById('order-view');
const node=(tag,t='',cls='')=>{const n=document.createElement(tag);n.textContent=t;n.className=cls;return n};
const money=n=>'L '+Number(n).toFixed(2);
const btn=(t,fn)=>{const b=node('button',t,'btn');b.type='button';b.onclick=fn;return b};
const link=(t,url)=>{const a=node('a',t,'btn');a.href=url;return a};
function history(){ov.replaceChildren();const orders=read(ok,[]);if(!orders.length)ov.append(node('p','No tienes solicitudes registradas.'));orders.slice().reverse().forEach(o=>{const c=node('article','','tarjeta order-card'),h=node('div','','order-head'),name=node('div');name.append(node('h3',o.type),node('p',o.id));const business=o.type==='Business';h.append(name,node('span',business?'Cotización pendiente':o.paid?'En camino':'Pendiente de pago','order-status'+(!business&&o.paid?' paid':'')));c.append(h,node('p',o.detail),node('p',business?'Importe por cotizar':money(o.total),'order-total'));if(o.paid&&!business)c.append(node('p','Pago simulado confirmado'));const actions=node('div','','order-actions');if(!business&&!o.paid)actions.append(link('Pagar pedido','pagos.html?codigo='+encodeURIComponent(o.id)));actions.append(link('Rastrear pedido','rastreo.html?codigo='+encodeURIComponent(o.id)));c.append(actions);ov.append(c)})}
async function init(){let products;try{const r=await fetch('/api/productos');if(!r.ok)throw Error();products=await r.json()}catch{cv.append(node('p','No se pudo cargar el catálogo. Recarga la página.'));history();return;}
const get=id=>products.find(p=>p.id===id);
function render(){cv.replaceChildren();const a=read(ck,[]);if(!a.length){cv.append(node('p','Carrito vacío'),link('Ir a Market','market.html'));history();return;}const c=node('article','','tarjeta order-card');if(a.some(id=>!get(id))){c.append(node('p','Hay productos no disponibles. Retíralos antes de confirmar.'));}for(const id of new Set(a)){const p=get(id),qty=a.filter(x=>x===id).length,row=node('div','','cart-row'),info=node('div'),controls=node('div','','cart-controls');info.append(node('h3',p?p.nombre:'Producto no disponible'),node('p',p?money(p.precio)+' por unidad · '+money(p.precio*qty):''));controls.append(btn('−',()=>{a.splice(a.indexOf(id),1);save(ck,a);render()}),node('span',String(qty)));if(p)controls.append(btn('+',()=>{a.push(id);save(ck,a);render()}));controls.append(btn('Quitar',()=>{save(ck,a.filter(x=>x!==id));render()}));row.append(info,controls);c.append(row)}const subtotal=a.reduce((s,id)=>s+Number(get(id)?.precio||0),0);const summary=node('div','','cart-summary');summary.append(node('p','Subtotal: '+money(subtotal)),node('p','Envío: '+money(45)),node('p','Total: '+money(subtotal+45),'order-total'));if(a.every(id=>get(id)))summary.append(btn('Confirmar pedido',()=>{const orders=read(ok,[]);orders.push({id:'E360-'+Date.now().toString(36).toUpperCase(),type:'Market',total:subtotal+45,detail:a.map(id=>get(id).nombre).join(', '),paid:false});save(ok,orders);save(ck,[]);render()}));c.append(summary);cv.append(c);history()}render()}
init();})();</script></body></html>
