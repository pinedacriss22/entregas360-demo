<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Entregas360 | Pagos</title><link rel="stylesheet" href="../styles.css"><script src="../demo-api.js"></script><style>.e360-photo{width:100%;height:155px;object-fit:cover;border-radius:12px;margin-bottom:12px}.e360-placeholder{height:155px;background:#e6f1e9;color:#176344;display:grid;place-items:center;border-radius:12px;margin-bottom:12px;font-size:38px}.e360-summary{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.e360-summary>div{flex:1;min-width:130px;background:white;border:1px solid #dce7df;padding:18px;border-radius:14px}.e360-summary strong{display:block;font-size:24px;color:#087c4e}.e360-tools{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}.e360-tools input,.e360-tools select{padding:12px;border:1px solid #bdcec3;border-radius:8px;max-width:100%}.e360-status{font-weight:600;color:#087c4e}.e360-card{margin:14px 0;text-align:left}.e360-card .btn{margin:8px 8px 0 0;display:inline-block}header nav{flex-wrap:wrap;gap:12px} @media(max-width:800px){header{flex-wrap:wrap;gap:12px}header nav{justify-content:flex-start}} </style></head><body><header><div class="logo">Entregas<span>360</span></div><nav><a href="../index.html">Inicio</a><a href="market.html">Market</a><a href="express.html">Express</a><a href="business.html">Business</a><a href="pedidos.html">Pedidos</a><a href="pagos.html">Pagos</a><a href="rastreo.html">Rastreo</a><a href="login.html">Iniciar sesión</a><a href="registro.html">Registrarse</a></nav></header><main><section class="servicios"><h1>Pagos</h1><p>Versión demostrativa. No se realizan cobros ni envíos reales.</p><div id="payment-view"></div></section></main><footer>Entregas360 | San Pedro Sula</footer><script src="../sesion.js"></script><script src="../alertas.js"></script><script>(()=>{const read=(k,d)=>JSON.parse(localStorage.getItem('e360demo-v1-'+k)||JSON.stringify(d)),uid=read('session',null);if(!uid){location.replace('login.html');return}const key='orders-'+uid,root=document.getElementById('payment-view'),code=new URLSearchParams(location.search).get('codigo');const n=(tag,text='',cls='')=>{const e=document.createElement(tag);e.textContent=text;e.className=cls;return e},money=x=>'L '+Number(x).toFixed(2);function render(){root.replaceChildren();const all=read(key,[]),orders=all.filter(o=>o.type!=='Business'),pending=orders.filter(o=>!o.paid),summary=n('div','','e360-summary');for(const [label,val] of [['Pendiente',money(pending.reduce((s,o)=>s+Number(o.total),0))],['Pagado (simulado)',money(orders.filter(o=>o.paid).reduce((s,o)=>s+Number(o.total),0))]]){const d=n('div');d.append(n('span',label),n('strong',val));summary.append(d)}root.append(summary);if(!orders.length)root.append(n('p','No tienes pedidos para pagar.'));orders.sort((a,b)=>Number(b.id===code)-Number(a.id===code)).forEach(o=>{const c=n('article','','tarjeta e360-card');c.append(n('h3',o.type+' · '+o.id),n('p',o.detail),n('h2',money(o.total)),n('p',o.paid?'Pago simulado confirmado · En camino':'Pendiente de pago','e360-status'));if(!o.paid){const b=n('button','Confirmar pago simulado','btn');b.type='button';b.onclick=()=>{const fresh=read(key,[]),item=fresh.find(x=>x.id===o.id);if(!item||item.paid)return;item.paid=true;localStorage.setItem('e360demo-v1-'+key,JSON.stringify(fresh));render();mostrarAlerta({tipo:'exito',titulo:'Pago confirmado',mensaje:'Simulación exitosa por '+money(item.total)+'. No se realizó ningún cobro.'})};c.append(b)}else{const a=n('a','Rastrear pedido','btn');a.href='rastreo.html?codigo='+encodeURIComponent(o.id);c.append(a)}root.append(c)})}render()})();</script></body></html>
